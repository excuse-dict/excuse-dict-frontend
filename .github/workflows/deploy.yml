name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Security Gate
        run: |
          # Next.js 최소 패치 버전 확인 (보안 릴리스 기준)
          node -e '
            const min = [15, 5, 29];
            const v = require("next/package.json").version;
            const cur = v.split("-")[0].split(".").map(Number);
            console.log("next version:", v);
            for (let i = 0; i < 3; i++) {
              if (cur[i] > min[i]) process.exit(0);
              if (cur[i] < min[i]) { console.error("next " + v + " < " + min.join(".")); process.exit(1); }
            }
          '
          # 운영 의존성 high 이상 취약점이 있으면 배포 중단
          npm audit --omit=dev --audit-level=high
          # 사이트 키 플레이스홀더가 남아 있으면 배포 중단
          if grep -q "REPLACE_WITH" .env.production; then
            echo ".env.production에 플레이스홀더가 남아 있습니다." && exit 1
          fi

      - name: Build
        # NEXT_PUBLIC_* 값은 .env.production에서 빌드 시점에 주입됨
        run: npx next build --no-lint

      - name: Deploy to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".next/, package.json, package-lock.json, next.config.*, public/"
          target: "/home/ubuntu/excuse-dict-frontend/"

      - name: Restart App
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/ubuntu/excuse-dict-frontend

            # 기존 프로세스 종료
            PID=$(lsof -t -i:3000) || true
            if [ ! -z "$PID" ]; then
                kill -9 $PID
                sleep 2
            fi
            pm2 delete excuse-dict-frontend || true

            # 이전 배포에서 남은 TS 설정 파일 제거 (런타임 typescript 의존 방지)
            rm -f next.config.ts

            # 의존성 설치 및 앱 시작
            npm ci --omit=dev --ignore-scripts
            # 루프백에만 바인딩 (외부 접근은 nginx 경유)
            pm2 start npm --name "excuse-dict-frontend" -- start -- -H 127.0.0.1
            pm2 save

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            sleep 10
            # 3000 포트가 127.0.0.1에만 열려 있는지 확인
            if ss -ltnH 'sport = :3000' | awk '{print $4}' | grep -vq '^127\.0\.0\.1:'; then
                echo "3000 포트가 127.0.0.1 외 주소에 바인딩되어 있습니다!"
                ss -ltn 'sport = :3000'
                exit 1
            fi
            curl -f http://127.0.0.1:3000 || {
                echo "Health check failed!"
                pm2 logs excuse-dict-frontend --lines 20 || true
                exit 1
            }
            echo "✅ App is running successfully!"
